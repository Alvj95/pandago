# Publica el tutor IA gratis en Cloudflare Workers (Workers AI).
# Requisito (una vez), en Settings → Secrets and variables → Actions:
#   - secreto CLOUDFLARE_API_TOKEN  (plantilla «Edit Cloudflare Workers» + permiso «Workers AI: Read»)
#   - secreto CLOUDFLARE_ACCOUNT_ID
# Después, la variable TUTOR_URL (pestaña «Variables») con la dirección que muestra este workflow
# hace que la app y la web se conecten al tutor.
name: Deploy tutor

on:
  push:
    branches: [main]
    paths: ['server/**', 'src/features/chat/engine/**', 'src/data/hsk/**', '.github/workflows/tutor.yml']
  workflow_dispatch:

concurrency:
  group: tutor
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci
        working-directory: server
      - run: npm run typecheck && npm test
        working-directory: server
      - name: Publicar en Cloudflare
        if: env.HAS_CF == 'true'
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          {
            echo "## 🐼 Tutor publicado"
            echo ""
            echo "Dirección: **$URL**"
            echo ""
            echo "Guárdala como variable **TUTOR_URL** (Settings → Secrets and variables → Actions → Variables) para que la app la use."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "URL=$URL" >> "$GITHUB_ENV"
      - name: Probar el tutor
        if: env.HAS_CF == 'true'
        run: |
          # Una dirección nueva de workers.dev tarda un poco en estar disponible.
          for i in $(seq 1 18); do curl -sf "$URL/health" && break; sleep 10; done
          echo
          cat > turn.json <<'JSON'
          {"scenario":{"id":"u1-ai","title":"Saludos","goal":"Preséntate y pregunta su nombre a Bao","persona":"bao","target_item_ids":["h1-你好","h1-叫","h1-名字"],"max_turns":6},
           "learner":{"hsk_level":1,"native_language":"español","weaknesses":[],"known_item_ids":[],"session_target_p":0.8},
           "history":[{"role":"tutor","text":"你好！你叫什么名字？"}],
           "input":{"kind":"text","text":"我叫是Ana"}}
          JSON
          RES=$(curl -s -w '\n%{http_code}' -X POST "$URL/v1/tutor/turn" -H 'content-type: application/json' --data @turn.json)
          CODE=$(echo "$RES" | tail -1)
          BODY=$(echo "$RES" | sed '$d')
          echo "$BODY"
          {
            echo ""
            echo "### Prueba de conversación (HTTP $CODE)"
            echo ""
            echo '```json'
            echo "$BODY"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          test "$CODE" = "200"
      # Voz china sintética (MeloTTS de Workers AI) grabada como m4a (AAC), igual que el micrófono de Android.
      - name: Probar el reconocimiento de voz
        if: env.HAS_CF == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null
          curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai/run/@cf/myshell-ai/melotts" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' \
            --data '{"prompt":"你好，我叫宝宝。","lang":"zh"}' > tts.json
          jq -r '.result.audio' tts.json | base64 -d > take.mp3 || { jq -c '.errors' tts.json; exit 1; }
          ffmpeg -loglevel error -y -i take.mp3 -ar 44100 -ac 1 -c:a aac -b:a 128k take.m4a
          for EXPECTED in "你好，我叫宝宝。" ""; do
            RES=$(curl -s -w '\n%{http_code}' -X POST "$URL/v1/speech/assess" -F "audio=@take.m4a;type=audio/m4a" -F "expected=$EXPECTED")
            CODE=$(echo "$RES" | tail -1)
            BODY=$(echo "$RES" | sed '$d')
            echo "esperado='$EXPECTED' → HTTP $CODE $BODY"
            { echo ""; echo "### Voz (esperado: '$EXPECTED') → HTTP $CODE"; echo '```json'; echo "$BODY"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            test "$CODE" = "200"
          done
      - name: Probar la voz de Bao y «Pregúntale a Bao»
        if: env.HAS_CF == 'true'
        continue-on-error: true
        run: |
          CODE=$(curl -s -o bao.mp3 -w '%{http_code}' -G "$URL/v1/speech/tts" --data-urlencode "text=你好，我是宝宝！")
          SIZE=$(stat -c %s bao.mp3)
          TYPE=$(file -b bao.mp3)
          echo "voz → HTTP $CODE, $SIZE bytes, $TYPE"
          RES=$(curl -s -w '\n%{http_code}' -X POST "$URL/v1/tutor/ask" -H 'content-type: application/json' \
            --data '{"question":"¿Por qué va 了?","context":{"hanzi":"我吃了饭。","pinyin":"wǒ chī le fàn","translation":"Ya he comido."},"hsk_level":1}')
          ASK_CODE=$(echo "$RES" | tail -1)
          echo "pregunta → HTTP $ASK_CODE $(echo "$RES" | sed '$d')"
          {
            echo ""
            echo "### Voz de Bao → HTTP $CODE ($SIZE bytes, $TYPE)"
            echo ""
            echo "### Pregúntale a Bao → HTTP $ASK_CODE"
            echo '```json'
            echo "$RES" | sed '$d'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          test "$CODE" = "200" && test "$SIZE" -gt 2000 && test "$ASK_CODE" = "200"
      - name: Probar el chat libre
        if: env.HAS_CF == 'true'
        continue-on-error: true
        run: |
          for MSG in "¿qué haces?" "我是喜欢苹果" "¿cómo se dice perro?" "tengo 30 años y vivo en Madrid"; do
            BODY=$(jq -nc --arg t "$MSG" '{messages:[{role:"bao",text:"你好！"},{role:"user",text:$t}],hsk_level:1,memory:[]}')
            RES=$(curl -s -w '\n%{http_code}' -X POST "$URL/v1/chat/free" -H 'content-type: application/json' --data "$BODY")
            CODE=$(echo "$RES" | tail -1)
            echo "«$MSG» → HTTP $CODE $(echo "$RES" | sed '$d')"
            { echo ""; echo "### Chat libre: «$MSG» → HTTP $CODE"; echo '```json'; echo "$RES" | sed '$d'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            test "$CODE" = "200"
          done
      - name: Probar Bao Asistente (texto y foto)
        if: env.HAS_CF == 'true'
        continue-on-error: true
        run: |
          ask() {
            RES=$(curl -s -w '\n%{http_code}' -X POST "$URL/v1/assist" -H 'content-type: application/json' --data @"$1")
            CODE=$(echo "$RES" | tail -1)
            echo "$2 → HTTP $CODE $(echo "$RES" | sed '$d' | head -c 900)"
            { echo ""; echo "### Asistente: $2 → HTTP $CODE"; echo '```json'; echo "$RES" | sed '$d' | head -c 1500; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            test "$CODE" = "200"
          }
          jq -nc '{text:"你周末有空吗？我们去喝茶吧！",question:"¿Cómo le digo que sí, que el sábado?",hsk_level:1}' > a1.json
          ask a1.json "responder a un mensaje"
          jq -nc '{question:"¿Cómo se dice «¿dónde está el baño?»",hsk_level:1}' > a2.json
          ask a2.json "cómo se dice"
          # Foto de un menú con texto chino, generada aquí mismo.
          sudo apt-get install -y -qq fonts-noto-cjk imagemagick > /dev/null
          FONT=$(fc-list :lang=zh file | grep -m1 -oE '/[^:]+NotoSansCJK[^:]*\.tt[cf]' || fc-list :lang=zh file | head -1 | cut -d: -f1)
          echo "fuente: $FONT"
          convert -size 640x320 xc:'#FFF4DD' -font "$FONT" -fill '#3A2010' -pointsize 46 \
            -annotate +40+80 '菜单' -annotate +40+160 '宫保鸡丁  ¥38' -annotate +40+240 '饺子  ¥22' menu.jpg
          jq -nc --arg img "$(base64 -w0 menu.jpg)" '{image:$img,question:"¿Qué pone en este menú?",hsk_level:1}' > a3.json
          ask a3.json "foto de un menú"
      - name: Falta configurar Cloudflare
        if: env.HAS_CF != 'true'
        run: echo "Añade los secretos CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID para publicar el tutor." >> "$GITHUB_STEP_SUMMARY"
