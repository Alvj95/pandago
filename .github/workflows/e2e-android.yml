# Prueba de extremo a extremo del APK publicado en un emulador Android:
# abre la app, Bao Asistente y el chat libre, escribe preguntas y lee la pantalla.
# Las capturas se publican en la Release «e2e-diagnostico».
name: Probar APK en emulador

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Versión a probar (vacío = la última)
        required: false
  push:
    branches: [main]
    paths: ['scripts/e2e/**', '.github/workflows/e2e-android.yml']

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Descargar el APK
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName); fi
          echo "Probando $TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p PandaGO.apk -O app.apk
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulador y prueba
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/e2e/android-e2e.sh
      - name: Publicar capturas
        if: always()
        run: |
          gh release view e2e-diagnostico --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
            gh release create e2e-diagnostico --repo "$GITHUB_REPOSITORY" --prerelease --title "Diagnóstico E2E" --notes "Capturas de la prueba automática en emulador (no es una versión para instalar)."
          cd e2e-out && for f in *.png logcat.txt; do [ -f "$f" ] && cp "$f" "e2e-$f"; done
          gh release upload e2e-diagnostico --repo "$GITHUB_REPOSITORY" --clobber e2e-*.png e2e-logcat.txt || true
